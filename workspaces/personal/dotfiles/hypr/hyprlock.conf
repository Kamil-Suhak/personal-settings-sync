general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(40, 44, 52, 1.0)
}

input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(61afef)
    inner_color = rgb(21252b)
    font_color = rgb(abb2bf)
    fail_color = rgb(e06c75)
    check_color = rgb(98c379)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(abb2bf)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
